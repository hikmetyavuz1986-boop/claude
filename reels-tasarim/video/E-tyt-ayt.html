<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Zeus Matematik · E · TYT–AYT netleri</title>
<link rel="stylesheet" href="ortak.css">
<style>
.chart{position:absolute;left:90px;top:170px;width:900px;height:680px}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lbl{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:36px;fill:rgba(255,255,255,.75)}
.flat{stroke:#FF8A5B;stroke-width:6;stroke-dasharray:18 14;fill:none;animation:fade .5s ease 2.6s both}
.rise{stroke:#E9B949;stroke-width:12;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:go 2s cubic-bezier(.4,0,.2,1) 5.8s both}
@keyframes go{to{stroke-dashoffset:0}}
.chips{position:absolute;left:80px;right:80px;top:190px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.chip{padding:26px 36px;border-radius:999px;background:rgba(233,185,73,.14);border:3px solid #E9B949;font-size:44px;font-weight:800;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="progress"><i></i></div>

  <!-- 0–5 sn: SORUN -->
  <div class="scene s1">
    <svg class="chart" viewBox="0 0 900 680" aria-hidden="true">
      <path d="M40 600H860" stroke="rgba(255,255,255,.3)" stroke-width="4"></path>
      <rect class="bar" x="90"  y="400" width="130" height="200" rx="14" fill="rgba(255,255,255,.28)" style="animation-delay:.4s"></rect>
      <rect class="bar" x="290" y="392" width="130" height="208" rx="14" fill="rgba(255,255,255,.28)" style="animation-delay:.8s"></rect>
      <rect class="bar" x="490" y="404" width="130" height="196" rx="14" fill="rgba(255,255,255,.28)" style="animation-delay:1.2s"></rect>
      <rect class="bar" x="690" y="398" width="130" height="202" rx="14" fill="rgba(255,255,255,.28)" style="animation-delay:1.6s"></rect>
      <path class="flat" d="M70 380 H840"></path>
      <text class="lbl" x="155" y="650" text-anchor="middle">1. deneme</text>
      <text class="lbl" x="355" y="650" text-anchor="middle">2.</text>
      <text class="lbl" x="555" y="650" text-anchor="middle">3.</text>
      <text class="lbl" x="755" y="650" text-anchor="middle">4.</text>
    </svg>
    <div class="wrap" style="top:900px">
      <div class="kicker up" style="animation-delay:.5s">YKS'YE HAZIRLANANLARA</div>
      <h1 class="h up" style="font-size:100px;animation-delay:.8s">TYT–AYT netlerin yerinde mi sayıyor<span class="gold">?</span></h1>
      <div class="sub up" style="animation-delay:2.8s">Çok çalışıyorsun ama grafik değişmiyor.</div>
    </div>
  </div>

  <!-- 5–10 sn: ÇÖZÜM -->
  <div class="scene s2">
    <div class="chips">
      <div class="chip pop" style="animation-delay:5.4s">Eksik analizi</div>
      <div class="chip pop" style="animation-delay:5.9s">Hedefli soru çözümü</div>
      <div class="chip pop" style="animation-delay:6.4s">Zaman yönetimi</div>
    </div>
    <svg class="chart" viewBox="0 0 900 680" aria-hidden="true" style="top:420px;height:520px">
      <path d="M40 480H860" stroke="rgba(255,255,255,.3)" stroke-width="4"></path>
      <rect x="90"  y="330" width="130" height="150" rx="14" fill="rgba(255,255,255,.10)"></rect>
      <rect x="290" y="324" width="130" height="156" rx="14" fill="rgba(255,255,255,.10)"></rect>
      <rect x="490" y="333" width="130" height="147" rx="14" fill="rgba(255,255,255,.10)"></rect>
      <rect x="690" y="328" width="130" height="152" rx="14" fill="rgba(255,255,255,.10)"></rect>
      <path class="rise" d="M80 420 C 260 410, 360 340, 470 290 S 680 160, 830 70"></path>
      <circle cx="830" cy="70" r="26" fill="#E9B949" style="animation:pop .5s cubic-bezier(.2,.9,.25,1.35) 7.7s both;transform-box:fill-box;transform-origin:center"></circle>
    </svg>
    <div class="wrap" style="top:1010px">
      <div class="kicker up" style="animation-delay:5.2s">ÇÖZÜM</div>
      <h2 class="h up" style="font-size:96px;animation-delay:6.3s">Daha çok değil, <span class="gold">daha doğru çalış.</span></h2>
    </div>
  </div>

  <!-- 10–15 sn: TEKLİF -->
  <div class="scene s3">
    <div class="close">
      <img class="logo pop" src="logo.jpg" alt="Zeus Matematik" style="animation-delay:10.2s">
      <div class="offer up" style="animation-delay:11.0s">
        <b>TYT–AYT'ye birebir hazırlık</b>
        <span>Yüz yüze · İstanbul Avrupa Yakası</span>
      </div>
      <div class="cta" style="animation-delay:11.9s,13.1s">Hemen Mesaj Gönder</div>
    </div>
  </div>
  <div class="flash"></div>
</div>
</body>
</html>
